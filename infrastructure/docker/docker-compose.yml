name: knorooms-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: knorooms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knorooms}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-knorooms_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-knorooms_local_dev_migrator}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - knorooms_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-knorooms_migrator} -d ${POSTGRES_DB:-knorooms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: knorooms-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knorooms_pgdata:

# Actualizaciones automáticas de dependencias (KNO-13).
# Cómo vincular estos PR a un ticket de Jira: docs/SCRUM.md §9.4.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Santo_Domingo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Herramientas de prueba en un solo PR, también en versiones mayores (KNO-70):
      # Dependabot abría un PR conjunto y otro por cada proyecto de prueba.
      # Mvc.Testing queda fuera porque sigue la versión de ASP.NET Core.
      nuget-test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "NetArchTest.*"
          - "Testcontainers.*"
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Santo_Domingo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen la versión mayor del runtime (Node 22, KNO-70).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Santo_Domingo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

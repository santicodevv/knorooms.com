    function statsCard(icon,title,value,note,iconClass,filter){return `<button class="panel stat" style="border:1px solid var(--line);text-align:left;width:100%" data-action="stat-filter" data-filter="${esc(filter)}"><div class="stat-top"><div class="stat-label">${title}</div><div class="stat-icon ${iconClass}">${ic(icon,19)}</div></div><div class="stat-number">${value}</div><div class="stat-note">${note}</div>${sparkline([3,3,4,4,5,6,5,7,9,9,10,12])}</button>`}
    function lineChart(){const n=s.period==='6'?6:12, labels=s.period==='6'?['May','Jun','Jul','Ago','Sep','Oct']:['Nov','Dic','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct'];const raw=Array.from({length:n},(_,i)=>{const offset=n-1-i;const lastDay=new Date(Date.UTC(2026,10-offset,0)).toISOString().slice(0,10);return schools.filter(school=>school.created<=lastDay).length});const W=620,H=225,pl=39,pr=10,pt=15,pb=33;let max=Math.max(4,Math.ceil(schools.length/4)*4),yw=y=>pt+(max-y)/max*(H-pt-pb),xx=i=>pl+(i/(n-1))*(W-pl-pr);const line=raw.map((v,i)=>`${i?'L':'M'} ${xx(i).toFixed(2)} ${yw(v).toFixed(2)}`).join(' ');const area=line+` L ${xx(n-1)} ${H-pb} L ${xx(0)} ${H-pb} Z`;const grids=Array.from({length:5},(_,i)=>i*max/4).map(v=>`<line class="grid-line" x1="${pl}" y1="${yw(v)}" x2="${W-pr}" y2="${yw(v)}"/><text x="${pl-11}" y="${yw(v)+4}" text-anchor="end">${v}</text>`).join('');const ticks=labels.map((v,i)=>`<text x="${xx(i)}" y="${H-9}" text-anchor="middle">${v}</text>`).join('');const dots=raw.map((v,i)=>`<circle class="chart-dot" cx="${xx(i)}" cy="${yw(v)}" r="3.7"><title>${labels[i]}: ${v} instituciones (demostración)</title></circle>`).join('');return `<svg viewBox="0 0 ${W} ${H}" class="line-chart" role="img" aria-label="Gráfica de crecimiento acumulado de instituciones, con datos ilustrativos"><defs><linearGradient id="areag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#155DFC" stop-opacity=".16"/><stop offset="1" stop-color="#155DFC" stop-opacity="0"/></linearGradient></defs>${grids}<path d="${area}" fill="url(#areag)"/><path class="chart-line" d="${line}"/>${dots}${ticks}</svg>`}
    function dashboard(){const active=schools.filter(x=>x.status==='Activa').length,suspended=schools.length-active,pending=schools.filter(x=>x.adminStatus!=='Activo').length;const moduleCounts=modules.filter(m=>!m.comingSoon).map(m=>({...m,count:schools.filter(x=>x.modules.has(m.id)).length}));const attention=[{state:'Sin administrador',num:countSt('Sin administrador'),icon:'user-x',cl:'orange',desc:'Instituciones que aún necesitan administrador.'},{state:'Vencida',num:countSt('Vencida'),icon:'clock',cl:'orange',desc:'Invitaciones con enlaces expirados.'},{state:'Fallido',num:countSt('Fallido'),icon:'mail-x',cl:'red',desc:'Invitaciones que no pudieron enviarse.'}];return `${header('Dashboard','Una visión general de las instituciones y la actividad administrativa de KNOROOMS.',`<span class="badge-demo">${ic('info',13)} Datos de ejemplo</span><button class="btn btn-quiet" data-action="demo-refresh">${ic('refresh-cw',14)} Actualizar</button>`)}<section class="stats-grid">${statsCard('building-2','Instituciones registradas',schools.length,'Total de colegios registrados','','Todos')}${statsCard('check-circle-2','Instituciones activas',active,'Disponibles en la plataforma','green','Activa')}${statsCard('pause-circle','Instituciones suspendidas',suspended,'Acceso institucional restringido','orange','Suspendida')}${statsCard('user-x','Sin administrador activo',pending,'Sin asignar o activación pendiente','purple','noactive')}</section><section class="dash-grid"><div class="panel chart-card"><div class="card-heading"><div><h2 class="card-title">Crecimiento de instituciones</h2><div class="card-sub">Evolución acumulada de colegios registrados</div></div><select aria-label="Período del gráfico" class="select-min" id="chart-period"><option value="6" ${s.period==='6'?'selected':''}>Últimos 6 meses</option><option value="12" ${s.period==='12'?'selected':''}>Últimos 12 meses</option></select></div>${lineChart()}<div class="chart-footer"><span class="legend"><i class="legend-dot"> va institución',d:'Registrar un colegio',a:'new'},{ic:'building-2',t:'Ver instituciones',d:'Consultar y gestionar',a:'list'},{ic:'user-plus',t:'Invitar administrador',d:'Colegios sin activar',a:'invite-list'},{ic:'layers-3',t:'Administrar módulos',d:'Configurar por colegio',a:'modules-list'}].map(q=>`<button class="quick-action" data-action="${q.a}"><span class="quick-icon">${ic(q.ic,18)}</span><span style="min-width:0;flex:1"><span>${q.t}</span><small>${q.d}</small></span><span class="qi-arrow">${ic('arrow-right',15)}</span></button>`).join('')}</div></div></section><section class="bottom-grid"><div class="panel compact-card"><div class="card-heading"><div><h2 class="card-title">Actividad reciente</h2><div class="card-sub">Acciones administrativas de muestra</div></div></div>${logs.slice(0,5).map(l=>`<div class="feed-row"><span class="feed-icon">${ic(l.icon,15)}</span><span style="min-width:0"><div class="feed-head">${esc(l.action)}</div><div class="feed-text">${esc(l.school)}</div></span><span class="feed-time">${esc(l.when)}</span></div>`).join('')}</div><div class="panel compact-card"><div class="card-heading"><div><h2 class="card-title">Instituciones recientes</h2><div class="card-sub">Colegios incorporados recientemente</div></div><button class="btn-link" data-nav="list">Ver todas ${ic('arrow-right',12)}</button></div><div class="tiny-list">${[...schools].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5).map(x=>`<button class="tiny-institution" data-open="${x.id}"><span class="school-avatar">${schoolIcon(16)}</span><span style="flex:1;min-width:0"><span class="tiny-name" style="display:block">${esc(x.name)}</span><span class="tiny-meta" style="display:block">${esc(x.slug)} · ${fmtDate(x.created)}</span></span>${statusBadge(x.status)}</button>`).join('')}</div></div></section>`}
    function filteredSchools(){return schools.filter(x=>{const q=s.filterSearch.trim().toLowerCase();return (!q||`${x.name} ${x.slug} ${x.adminEmail}`.toLowerCase().includes(q))&&(s.filterStatus==='Todos'||x.status===s.filterStatus)&&(s.filterAdmin==='Todos'||(s.filterAdmin==='noactive'?x.adminStatus!=='Activo':x.adminStatus===s.filterAdmin))}).sort((a,b)=>b.created.localeCompare(a.created)||b.id-a.id)}

    function actionMenu(x){return `<div class="row-menu-wrap"><button class="btn btn-quiet btn-square" data-menu="${x.id}" aria-label="Más acciones para ${esc(x.name)}" aria-expanded="${s.rowMenu===x.id}">${ic('more-vertical',16)}</button>${s.rowMenu===x.id?`<div class="dropdown">${rowActions(x).map((o,i)=>`${i===rowActions(x).length-1?'<div class="dropdown-divider"></div>':''}<button class="${o.danger?'danger':''}" data-row-action="${o.action}" data-id="${x.id}">${ic(o.icon,15)} ${o.text}</button>`).join('')}</div>`:''}</div>`}
    function listing(){const rows=filteredSchools();const pageCount=Math.max(1,Math.ceil(rows.length/s.pageSize));s.currentPage=Math.min(s.currentPage,pageCount);const visible=rows.slice((s.currentPage-1)*s.pageSize,s.currentPage*s.pageSize);return `${header('Instituciones','Consulta, organiza y configura los colegios de tu plataforma.',`<button class="btn btn-primary btn-lg" data-nav="new">${ic('plus',16)} Nueva institución</button>`)}<div class="panel table-panel"><div class="filter-area"><div class="field-with-icon">${ic('search',16)}<input class="input" id="filter-search" placeholder="Buscar por nombre, subdominio o correo..." value="${esc(s.filterSearch)}"/></div><select id="filter-status" class="select" aria-label="Filtrar por estado"><option value="Todos">Todos los estados</option><option value="Activa" ${s.filterStatus==='Activa'?'selected':''}>Activas</option><option value="Suspendida" ${s.filterStatus==='Suspendida'?'selected':''}>Suspendidas</option></select><select id="filter-admin" class="select" aria-label="Filtrar por administrador">${[['Todos','Todos los administradores'],['noactive','Sin administrador activo'],['Sin administrador','Sin administrador'],['Pendiente','Invitación pendiente'],['Vencida','Invitación vencida'],['Fallido','Envío fallido'],['Activo','Administrador activo']].map(([v,l])=>`<option value="${v}" ${s.filterAdmin===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn btn-quiet" data-action="clear-filters">${ic('refresh-cw',14)} Limpiar</button></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>INSTITUCIÓN</th><th>ESTADO</th><th>ADMINISTRADOR INICIAL</th><th>MÓDULOS</th><th style="text-align:right">ACCIONES</th></tr></thead><tbody>${visible.map(x=>`<tr><td><div class="institution-cell"><span class="school-avatar">${schoolIcon(17)}</span><div><div class="inst-name">${esc(x.name)}</div><div class="inst-sub">${esc(x.slug)}</div></div></div></td><td>${statusBadge(x.status)}</td><td>${statusBadge(x.adminStatus)}${x.adminEmail?`<div class="admin-email">${esc(x.adminEmail)}</div>`:''}</td><td><span class="pill blue">${x.modules.size} de 6</span></td><td><div class="actions-cell"><button class="btn btn-quiet btn-xs" data-open="${x.id}">${ic('eye',13)} Ver ficha</button>${actionMenu(x)}</div></td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${visible.map(x=>`<div class="mobile-inst"><div style="display:flex;align-items:center;gap:10px"><span class="school-avatar">${schoolIcon(17)}</span><div style="flex:1;min-width:0"><div class="inst-name">${esc(x.name)}</div><div class="inst-sub">${esc(x.slug)}</div></div>${actionMenu(x)}</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${statusBadge(x.status)}${statusBadge(x.adminStatus)}<span class="pill blue">${x.modules.size} módulos</span></div><div class="mobile-inst-footer"><span class="muted" style="font-size:10px">${esc(x.adminEmail||'Sin correo de administrador')}</span><button class="btn btn-quiet btn-xs" data-open="${x.id}">Ver ficha ${ic('arrow-right',13)}</button></div></div>`).join('')}</div><div class="pagination"><span class="pagination-info">Mostrando ${rows.length?(s.currentPage-1)*s.pageSize+1:0}–${Math.min(s.currentPage*s.pageSize,rows.length)} de ${rows.length} instituciones</span><div class="page-buttons"><button class="page-btn" data-page="prev" ${s.currentPage===1?'disabled':''}>${ic('chevron-left',14)}</button>${Array.from({length:pageCount},(_,i)=>`<button class="page-btn ${s.currentPage===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}<button class="page-btn" data-page="next" ${s.currentPage===pageCount?'disabled':''}>${ic('chevron-right',14)}</button></div></div>`:`<div class="empty-state"><span class="empty-icon">${ic('search',25)}</span><h3>No encontramos instituciones</h3><p>Prueba con otra búsqueda o ajusta los filtros seleccionados.</p><button class="btn btn-quiet" data-action="clear-filters">Limpiar filtros</button></div>`}<     function wizardStep(){return `<aside class="panel wizard-side">${[['1','Datos generales','Información y contacto'],['2','Módulos','Selecciona capacidades'],['3','Confirmación','Revisa y guarda']].map(([n,label,desc])=>`<button class="wizard-step ${s.formStep===+n?'current':s.formStep>+n?'completed':''}" data-wizard-step="${n}" ${+n>s.formStep?'disabled':''}><span class="step-dot">${s.formStep>+n?ic('check',12):n}</span><span><strong>${label}</strong><small>${desc}</small></span></button>`).join('')}</aside>`}

    function firstStep(){return `<h2 class="section-title">Datos generales de la institución</h2><p class="section-desc">Registra la información principal del colegio. Estos datos se pueden modificar después.</p><div class="form-group"><label for="form-name">Nombre oficial del colegio <span class="required">*</span></label><input id="form-name" data-form="name" class="input" placeholder="Ej. Colegio Dominicano San Miguel" maxlength="120" value="${esc(s.form.name)}"/>${err('name')}</div><div class="form-group"><label for="form-slug">Identificador / Subdominio <span class="required">*</span></label><div class="field-prefix"><input id="form-slug" data-form="slug" placeholder="colegio-san-miguel" maxlength="45" value="${esc(s.form.slug)}"/><span>.knorooms.local</span></div><p class="form-hint">Solo minúsculas, números y guiones. El dominio mostrado es ilustrativo.</p>${err('slug')}</div><div class="form-grid"><div class="form-group"><label for="form-contact">Correo de contacto institucional <span class="required">*</span></label><input id="form-contact" data-form="contact" type="email" class="input" placeholder="contacto@colegio.edu.do" value="${esc(s.form.contact)}"/>${err('contact')}</div><div class="form-group"><label for="form-phone">Teléfono (opcional)</label><input id="form-phone" data-form="phone" class="input" placeholder="809-000-0000" value="${esc(s.form.phone)}"/></div></div><div class="form-group"><label for="form-address">Dirección (opcional)</label><input id="form-address" data-form="address" class="input" placeholder="Ej. Santo Domingo Este, República Dominicana" value="${esc(s.form.address)}"/></div><div class="info-callout">${ic('info',17)}<span>El correo institucional es distinto del administrador inicial. Podrás invitar al administrador desde la ficha o desde su fila en el listado.</span></div>`}
    function closureAdd(set,id){set.add(id);(modules.find(m=>m.id===id)?.requires||[]).forEach(d=>closureAdd(set,d))}
    function dependents(set,id){return modules.filter(m=>set.has(m.id)&&m.requires.some(d=>d===id||dependents(set,d).length>0)).map(m=>m.id)}
    function closureRemove(set,id){set.delete(id);let change=true;while(change){change=false;modules.forEach(m=>{if(set.has(m.id)&&m.requires.some(r=>!set.has(r))){set.delete(m.id);change=true}})}}
    function moduleCards(selected,scope='create'){return `<div class="module-grid">${modules.map(m=>`<button class="module-card ${selected.has(m.id)?'selected':''} ${m.comingSoon?'disabled':''}" data-toggle-module="${m.id}" data-module-scope="${scope}" aria-pressed="${selected.has(m.id)}" ${m.comingSoon?'disabled title="Próximamente"':''}><div class="module-card-head"><span class="module-icon">${ic(m.icon,17)}</span>${m.comingSoon?'<span class="pill gray">Próximamente</span>':`<span class="module-check">${selected.has(m.id)?ic('check',12):''}</span>`}</div><div><strong>${esc(m.name)}</strong><p>${esc(m.description)}</p></div>${m.requires.length?`<div class="dependency">${ic('lock',12)} Requiere: ${m.requires.map(id=>esc(modules.find(x=>x.id===id).short)).join(', ')}</div>`:''}</button>`).join('')}</div>`}
    function secondStep(){return `<h2 class="section-title">Selecciona los módulos</h2><p class="section-desc">Elige las funcionalidades disponibles para este colegio. Las dependencias se habilitan automáticamente.</p>${moduleCards(s.form.modules)}<div class="info-callout">${ic('info',17)}<span>Si activas Boletas, se habilitarán sus módulos necesarios. Si desactivas una dependencia, se desactivan las capacidades que la necesitan. Los datos históricos no se eliminan.</span></div>${err('modules')}`}
    function thirdStep(){return `<h2 class="section-title">Revisa antes de crear</h2><p class="section-desc">Comprueba la información y los módulos. El colegio se registrará al confirmar.</p><div class="summary-panel"><div class="summary-top"><strong>Información general</strong><button class="btn-link" data-wizard-step="1">Editar</button></div><div class="summary-grid"><div class="summary-item"><label>Nombre oficial</label><p>${esc(s.form.name)}</p></div><div class="summary-item"><label>Subdominio</label><p>${esc(s.form.slug)}.knorooms.local</p></div><div class="summary-item"><label>Correo de contacto</label><p>${esc(s.form.contact)}</p></div><div class="summary-item"><label>Teléfono</label><p>${esc(s.form.phone||'No especificado')}</p></div></div></div><div class="summary-panel"><div class="summary-top"><strong>Módulos seleccionados (${s.form.modules.size})</strong><button class="btn-link" data-wizard-step="2">Editar</button></div><div style="display:flex;gap:7px;flex-wrap:wrap">${modules.filter(m=>s.form.modules.has(m.id)).map(m=>`<span class="pill blue">${ic('check',11)} ${esc(m.name)}</span>`).join('')}</div></div><div class="info-callout">${ic('shield-check',18)}<span>Después de crear, podrás invitar al administrador inicial desde la fila de la institución. No tendrás que establecer su contraseña.</span></div>`}
    function newInstitution(){return `${header('Nueva institución','Crea y configura un colegio en unos pocos pasos.',`<button class="btn btn-quiet" data-action="cancel-new">${ic('x',14)} Cancelar</button>`,'Nueva institución')}<div class="wizard-layout">${wizardStep()}<section class="panel wizard-body">${s.formStep===1?firstStep():s.formStep===2?secondStep():thirdStep()}<div class="wizard-bottom"><div>${s.formStep>1?`<button class="btn btn-quiet" data-action="step-back">${ic('arrow-left',14)} Anterior</button>`:`<span class="muted" style="font-size:10px">Paso 1 de 3</span>`}</div>${s.formStep===3?`<button class="btn btn-primary btn-lg" data-action="create-school">${ic('check',15)} Crear institución</button>`:`<button class="btn btn-primary btn-lg" data-action="step-next">Continuar ${ic('arrow-right',15)}</button>`}</div></section></div>`}
    function details(){const x=selectedSchool();return `${header('Ficha de institución','Consulta y administra la configuración del colegio.',`<button class="btn btn-quiet" data-nav="list">${ic('arrow-left',14)} Volver al listado</button>`,x.name)}<section class="panel"><div class="detail-head"><div class="detail-identity"><span class="school-avatar">${schoolIcon(26)}</span><div><h2 class="detail-name">${esc(x.name)}</h2><div class="detail-sub"><span>${esc(x.slug)}.knorooms.local</span><button aria-label="Copiar subdominio" class="btn-link" data-action="copy-slug">${ic('copy',13)}</button>${statusBadge(x.status)}</div></div></div><div class="button-row"><button class="btn btn-quiet" data-action="edit-info">${ic('edit-3',14)} Editar información</button></div></div><div class="tabs" role="tablist">${['Resumen','Información','Módulos','Administrador'].map(t=>`<button role="tab" aria-selected="${s.detailTab===t}" class="tab ${s.detailTab===t?'active':''}" data-detail-tab="${t}">${t}</button>`).join('')}</div><div class="detail-content">${s.detailTab==='Resumen'?detailOverview(x):s.detailTab==='Información'?detailInfo(x):s.detailTab==='Módulos'?detailModules(x):detailAdmin(x)}</div></section>`}
    function detailOverview(x){return `<div class="detail-grid"><div class="inset-card"><div class="mini-flex" style="margin-bottom:16px"><h3 style="margin:0">Información general</h3><button class="btn-link" data-detail-tab="Información">Ver detalles ${ic('arrow-right',12)}</button></div><div class="info-pairs"><div><label>Nombre oficial</label><p>${esc(x.name)}</p></div><div><label>Subdominio</label><p>${esc(x.slug)}</p></div><div><label>Correo de contacto</label><p>${esc(x.contact)}</p></div><div><label>Registrada</label><p>${fmtDate(x.created)}</p></div></div></div><div class="inset-card"><div class="mini-flex" style="margin-bottom:14px"><h3 style="margin:0">Módulos habilitados</h3><button class="btn-link" data-detail-tab="Módulos">Administrar ${ic('arrow-right',12)}</button></div>${modules.filter(m=>!m.comingSoon&&x.modules.has(m.id)).map(m=>`<div class="simple-module"><span style="color:#2464e7">${ic(m.icon,15)}</span>${esc(m.name)}<span class="pill green">Activo</span></div>`).join('')}${modules.filter(m=>m.comingSoon).map(m=>`<div class="simple-module"><span style="color:#aab4c3">${ic(m.icon,15)}</span>${esc(m.name)}<span class="pill gray">Próximamente</span></div>`).join('')}</div><div class="inset-card wide-card"><div class="mini-flex" style="margin-bottom:16px"><h3 style="margin:0">Administrador inicial</h3><button class="btn-link" data-detail-tab="Administrador">Gestionar ${ic('arrow-right',12)}</button></div><div class="admin-hero"><div class="avatar">${ic('user-round',19)}</div><div style="flex:1"><div style="margin-bottom:6px">${statusBadge(x.adminStatus)}</div><div class="muted" style="font-size:11px">${esc(x.adminEmail||'Todavía no hay un administrador invitado.')}</div></div>${x.adminStatus==='Sin administrador'?`<button class="btn btn-primary btn-xs" data-action="open-invite" data-id="${x.id}">${ic('send',12)} Invitar</button>`:''}</div></div></div>`}
    function detailInfo(x){return `${s.editInfo?`<h3 style="font-size:13px;margin:0 0 20px">Editar información general</h3><div class="form-group"><label>Nombre oficial *</label><input class="input" id="edit-name" value="${esc(s.infoDraft.name)}"/></div><div class="form-grid"><div class="form-group"><label>Correo institucional *</label><input class="input" type="email" id="edit-contact" value="${esc(s.infoDraft.contact)}"/></div><div class="form-group"><label>Teléfono</label><input class="input" id="edit-phone" value="${esc(s.infoDraft.phone)}"/></div></div><div class="form-group"><label>Dirección</label><input class="input" id="edit-address" value="${esc(s.infoDraft.address)}"/></div><div class="button-row" style="margin-bottom:25px"><button class="btn btn-primary" data-action="save-info">${ic('save',14)} Guardar cambios</button><button class="btn btn-quiet" data-action="cancel-edit">Cancelar</button></div>`:`<div class="inset-card" style="margin-bottom:19px"><div class="mini-flex" style="margin-bottom:20px"><h3 style="margin:0">Información institucional</h3><button class="btn btn-quiet btn-xs" data-action="edit-info">${ic('edit-3',13)} Editar</button></div><div class="info-pairs"><div><label>Nombre oficial</label><p>${esc(x.name)}</p></div><div><label>Identificador</label><p>${esc(x.slug)}</p></div><div><label>Correo de contacto</label><p>${esc(x.contact)}</p></div><div><label>Teléfono</label><p>${esc(x.phone||'No especificado')}</p></div><div><label>Dirección</label><p>${esc(x.address||'No especificada')}</p></div><div><label>Fecha de registro</label><p>${fmtDate(x.created)}</p></div></div></div>`}<div class="danger-zone"><div><strong>Estado de la institución</strong><p>La suspensión restringe el acceso al colegio, sin eliminar información histórica.</p><div style="margin-top:8px">${statusBadge(x.status)}</div></div><button class="btn ${x.status==='Activa'?'btn-danger-quiet':'btn-quiet'}" data-action="toggle-status">${ic(x.status==='Activa'?'pause-circle':'check-circle-2',14)} ${x.status==='Activa'?'Suspender':'Reactivar'}</button></div>`}
    function detailModules(x){const sel=s.moduleDraft??x.modules;return `<div class="mini-flex" style="margin-bottom:18px"><div><h3 style="font-family:'Plus Jakarta Sans';font-size:14px;margin:0">Módulos del colegio</h3><p class="page-sub" style="margin-top:7px">Configura las funcionalidades habilitadas únicamente para esta institución.</p></div><span class="pill blue">${sel.size} de 6 habilitados</span></div>${moduleCards(sel,'detail')}<div class="info-callout">${ic('shield-check',16)} <span>Al deshabilitar un módulo se conserva su información histórica. Los módulos dependientes se deshabilitan también, previa confirmación.</span></div><div class="wizard-bottom"><button class="btn btn-quiet" data-action="reset-modules" ${!s.moduleDraft?'disabled':''}>Descartar cambios</button><button class="btn btn-primary" data-action="save-modules" ${!s.moduleDraft?'disabled':''}>${ic('save',14)} Guardar módulos</button></div>`}
    function detailAdmin(x){return `<div class="inset-card" style="margin-bottom:17px"><div class="mini-flex" style="margin-bottom:18px"><h3 style="margin:0">Administrador inicial</h3>${statusBadge(x.adminStatus)}</div><div class="admin-hero"><span class="avatar" style="height:46px;width:46px;border-radius:12px">${ic('user-round',21)}</span><div style="flex:1;min-width:0"><strong style="font-size:12px">${esc(x.adminEmail||'Sin administrador asignado')}</strong><p class="page-sub" style="margin-top:6px">${x.adminStatus==='Activo'?'Esta cuenta tiene acceso al portal institucional.':x.adminStatus==='Pendiente'?'Invitación enviada. Aún no se ha completado la activación.':x.adminStatus==='Vencida'?'El enlace anterior ha vencido.':x.adminStatus==='Fallido'?'No fue posible enviar la invitación.':'Invita a la primera persona que administrará este colegio.'}</p></div></div><div class="button-row" style="margin-top:20px">${x.adminStatus==='Sin administrador'?`<button class="btn btn-primary" data-action="open-invite" data-id="${x.id}">${ic('send',14)} Invitar administrador</button>`:x.adminStatus==='Activo'?`<span class="muted" style="font-size:10.5px">Activado: ${fmtDate(x.adminActiveDate)}</span>`:`<button class="btn btn-primary" data-action="resend" data-id="${x.id}">${ic('send',14)} ${x.adminStatus==='Fallido'?'Reintentar envío':'Reenviar invitación'}</button>${x.adminStatus==='Pendiente'?`<button class="btn btn-danger-quiet" data-action="revoke" data-id="${x.id}">${ic('ban',14)} Revocar</button>`:''}`}</div></div><div class="info-callout">${ic('lock',16)} <span>El invitado define su contraseña en un enlace seguro. Si ya dispone de una cuenta, debe confirmar su vinculación sin cambiar su contraseña actual.</span></div>`}
    function renderModal(){const x=schools.find(v=>v.id===s.modal?.id),m=s.modal;if(!m)return '';let title='',subtitle='',body='',footer='';if(m.type==='invite'){title='Invitar administrador';subtitle='Se enviará una invitación al correo de la persona responsable.';body=`<div class="modal-target"><strong>${esc(x.name)}</strong><small>${esc(x.slug)} · Institución seleccionada</small></div><div class="form-group"><label for="invite-email">Correo del administrador <span class="required">*</span></label><input class="input" type="email" id="invite-email" autocomplete="email" placeholder="director@colegio.edu.do" value="${esc(s.modalInput)}"/>${s.modalError?`<div class="form-error">${esc(s.modalError)}</div>`:''}<div class="form-hint">Recibirá un enlace de activación. No tendrás que definir su contraseña.</div></div><div class="info-callout" style="margin-top:0">${ic('shield-check',17)} <span>Si la persona ya tiene cuenta, podrá confirmar de forma segura su acceso al colegio.</span></div>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="send-invite">${ic('send',14)} Enviar invitación</button>`}else if(m.type==='resend'){title='Reenviar invitación';subtitle='Confirma antes de generar otro envío.';body=`<div class="modal-target"><strong>${esc(x.name)}</strong><small>${esc(x.adminEmail)}</small></div><p style="font-size:11.5px;line-height:1.75;color:#78879c">Se simulará un nuevo envío a esta dirección. En un sistema real el enlace anterior debe invalidarse para evitar duplicados.</p>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="confirm-resend">${ic('send',14)} Confirmar reenvío</button>`}else if(m.type==='revoke'){title='Revocar invitación';subtitle='Esta acción impedirá utilizar el enlace de activación.';body=`<div class="modal-target"><strong>${esc(x.name)}</strong><small>${esc(x.adminEmail)}</small></div><div class="info-callout">${ic('alert-circle',16)} La institución no se elimina y podrá enviarse otra invitación posteriormente.</div>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Cancelar</button><button class="btn btn-danger" data-action="confirm-revoke">Revocar invitación</button>`}else if(m.type==='status'){title=x.status==='Activa'?'Suspender institución':'Reactivar institución';subtitle='Confirma este cambio de estado institucional.';body=`<div class="modal-target"><strong>${esc(x.name)}</strong><small>Estado actual: ${esc(x.status)}</small></div><p style="font-size:11.5px;line-height:1.7;color:#7e8ba0">${x.status==='Activa'?'Se restringirá el acceso institucional sin borrar la información registrada.':'La institución volverá a figurar como activa en el sistema.'}</p>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Cancelar</button><button class="btn ${x.status==='Activa'?'btn-danger':'btn-primary'}" data-action="confirm-status">${x.status==='Activa'?'Suspender institución':'Reactivar institución'}</button>`}else if(m.type==='remove-modules'){title='Confirmar desactivación';subtitle='Este cambio afecta módulos dependientes.';body=`<p style="font-size:11.5px;line-height:1.7;color:#7c899e">Para deshabilitar <strong>${esc(modules.find(v=>v.id===m.moduleId)?.name)}</strong> también deben desactivarse los siguientes módulos:</p><div style="display:flex;flex-wrap:wrap;gap:7px;margin:14px 0">${m.affected.map(id=>`<span class="pill amber">${esc(modules.find(v=>v.id===id)?.name)}</span>`).join('')}</div><div class="info-callout">${ic('shield-check',16)} Los datos históricos se conservarán.</div>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Cancelar</button><button class="btn btn-danger" data-action="confirm-remove-modules">Desactivar módulos</button>`}else if(m.type==='cancel-new'){title='Salir de la creación';subtitle='Los datos que ingresaste se perderán.';body=`<p style="font-size:11.5px;color:#7b8ca1;line-height:1.7">¿Seguro que quieres abandonar la creación de la institución?</p>`;footer=`<button class="btn btn-quiet" data-action="close-modal">Seguir editando</button><button class="btn btn-danger-quiet" data-action="confirm-cancel-new">Salir sin guardar</button>`}else if(m.type==='logout'){title='Cierre de sesión';subtitle='Esta pantalla es únicamente una demostración visual.';body=`<p style="font-size:11.5px;color:#718098;line-height:1.7">No hay autenticación conectada. En la aplicación real esta acción cerrará tu sesión de forma segura.</p>`;footer=`<button class="btn btn-primary" data-action="close-modal">Entendido</button>`}return `<div class="overlay" data-overlay="true" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="icon-btn" aria-label="Cerrar" data-action="close-modal">${ic('x',18)}</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`}
    function toast(title,desc=''){const el=document.createElement('div');el.className='toast';el.innerHTML=`${ic('check-circle-2',18)}<span><strong>${esc(title)}</strong><small>${esc(desc)}</small></span>`;$('#toast-root').appendChild(el);setTimeout(()=>{el.style.opacity=0;el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320)},4200)}
    function nav(page){s.page=page;s.sidebarOpen=false;s.topPopover='';s.rowMenu=null;s.modal=null;if(page==='new'){s.formStep=1;s.form=blankForm();s.formErrors={}}if(page==='list')s.currentPage=1;render();window.scrollTo(0,0);history.replaceState({},'',`#${page==='new'?'instituciones/nueva':page==='list'?'instituciones':page==='dashboard'?'dashboard':`instituciones/${s.activeId}`}`)}
    function openSchool(id,tab='Resumen'){s.activeId=Number(id);s.detailTab=tab;s.moduleDraft=null;s.editInfo=false;nav('detail')}
    function clearFilters(){s.filterSearch='';s.filterStatus='Todos';s.filterAdmin='Todos';s.currentPage=1;render()}
    function applyFilterByStatus(value){s.filterSearch='';s.filterStatus=['Activa','Suspendida'].includes(value)?value:'Todos';s.filterAdmin=value==='noactive'?'noactive':'Todos';nav('list')}
    function handleModuleToggle(id,scope){if(id==='moodle')return;const target=scope==='detail'?(s.moduleDraft??new Set(selectedSchool().modules)):s.form.modules;const draft=new Set(target);if(!draft.has(id)){closureAdd(draft,id);if(scope==='detail')s.moduleDraft=draft;else s.form.modules=draft;render();toast('Selección actualizada', 'Se habilitaron las dependencias necesarias.');return}const affected=[id];closureRemove(draft,id);for(const old of target)if(!draft.has(old)&&old!==id)affected.push(old);if(affected.length>1){s.modal={type:'remove-modules',id:scope==='detail'?s.activeId:null,moduleId:id,affected,scope};s.editingModuleId=id;render();return}if(scope==='detail')s.moduleDraft=draft;else s.form.modules=draft;render()}
    function validateStepOne(){const x=s.form;const errors={};if(x.name.trim().length<3)errors.name='Escribe un nombre de al menos 3 caracteres.';if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(x.slug)||x.slug.length<3)errors.slug='Usa al menos 3 caracteres: minúsculas, números y guiones interiores.';else if(schools.some(y=>y.slug===x.slug))errors.slug='Este subdominio ya está registrado.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.contact.trim()))errors.contact='Introduce un correo electrónico válido.';s.formErrors=errors;return !Object.keys(errors).length}
    function nextStep(){if(s.formStep===1&&!validateStepOne()){render();toast('Revisa los datos','Corrige los campos marcados antes de continuar.');return}if(s.formStep===2&&!s.form.modules.size){s.formErrors.modules='Selecciona al menos un módulo disponible.';render();return}s.formErrors={};s.formStep=Math.min(3,s.formStep+1);render();window.scrollTo(0,0)}
    function createSchool(){if(!validateStepOne()){s.formStep=1;render();toast('Hay información por corregir');return}if(!s.form.modules.size){s.formStep=2;render();return}const id=Math.max(0,...schools.map(x=>x.id))+1;const f=s.form;const x={id,name:f.name.trim(),slug:f.slug,status:'Activa',adminStatus:'Sin administrador',adminEmail:'',modules:new Set(f.modules),created:'2026-10-23',contact:f.contact.trim(),phone:f.phone.trim(),address:f.address.trim(),inviteDate:'',adminActiveDate:''};schools.unshift(x);logs.unshift({icon:'building-2',action:'Institución registrada',school:x.name,when:'Ahora · demostración'});s.activeId=id;openSchool(id);toast('Institución creada','Registro simulado. Puedes invitar a su administrador desde el listado o la ficha.')}
    function modalOpen(type,id){s.modal={type,id:Number(id)};s.modalInput='';s.modalError='';s.rowMenu=null;s.topPopover='';render()}
    function handleRowAction(id,action){const x=schools.find(a=>a.id===id);s.rowMenu=null;if(action==='view')openSchool(id);if(action==='modules')openSchool(id,'Módulos');if(action==='admin'){if(x.adminStatus==='Sin administrador')modalOpen('invite',id);else openSchool(id,'Administrador')}if(action==='resend')modalOpen('resend',id);if(action==='revoke')modalOpen('revoke',id);if(action==='suspend')modalOpen('status',id)}
    function sendInvite(){const email=$('#invite-email')?.value.trim()||'';s.modalInput=email;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){s.modalError='Introduce un correo electrónico válido.';render();return}const x=schools.find(z=>z.id===s.modal.id);if(x.adminStatus!=='Sin administrador'){toast('Revisa el estado actual','Esta institución ya tiene una invitación o un administrador.');s.modal=null;render();return}x.adminEmail=email;x.adminStatus='Pendiente';x.inviteDate='2026-10-23';logs.unshift({icon:'mail',action:'Invitación creada (simulación)',school:x.name,when:'Ahora · demostración'});s.modal=null;render();toast('Invitación simulada','No se enviaron correos reales. El administrador figura ahora como pendiente.')}
    function confirmResend(){const x=schools.find(z=>z.id===s.modal.id);if(x.adminStatus==='Activo'){s.modal=null;render();return}x.adminStatus='Pendiente';x.inviteDate='2026-10-23';s.modal=null;render();toast('Reenvío simulado',`El enlace anterior se consideraría invalidado para ${x.adminEmail}.`)}
    function confirmRevoke(){const x=schools.find(z=>z.id===s.modal.id);x.adminStatus='Sin administrador';x.adminEmail='';x.inviteDate='';s.modal=null;render();toast('Invitación revocada (demo)','Podrás invitar a otro administrador desde la institución.')}
    function confirmStatus(){const x=schools.find(z=>z.id===s.modal.id);x.status=x.status==='Activa'?'Suspendida':'Activa';s.modal=null;render();toast('Estado actualizado',`${x.name}: ${x.status}.`)}
    function saveInfo(){const x=selectedSchool(),name=$('#edit-name')?.value.trim(),email=$('#edit-contact')?.value.trim();if(!name||name.length<3||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Revisa los campos','El nombre y correo institucional deben ser válidos.');return}x.name=name;x.contact=email;x.phone=$('#edit-phone')?.value.trim()||'';x.address=$('#edit-address')?.value.trim()||'';s.editInfo=false;render();toast('Información actualizada','Cambios guardados en esta demostración.')}
    async function copySlug(){const slug=`${selectedSchool().slug}.knorooms.local`;try{await navigator.clipboard.writeText(slug);toast('Subdominio copiado',slug)}catch(e){toast('Subdominio',slug)}}
    function runAction(action,el){switch(action){case 'toggle-sidebar':s.sidebarOpen=!s.sidebarOpen;render();break;case 'close-sidebar':s.sidebarOpen=false;render();break;case 'popover-notification':s.topPopover=s.topPopover==='notification'?'':'notification';render();break;case 'popover-user':s.topPopover=s.topPopover==='user'?'':'user';render();break;case 'demo-refresh':render();toast('Vista actualizada','Los indicadores se han recalculado con los datos de demostración.');break;case 'demo-logout':modalOpen('logout',s.activeId);break;case 'stat-filter':applyFilterByStatus(el.dataset.filter);break;case 'clear-filters':clearFilters();break;case 'new':nav('new');break;case 'list':nav('list');break;case 'invite-list':s.filterAdmin='Sin administrador';s.filterStatus='Todos';s.filterSearch='';nav('list');break;case 'modules-list':case 'go-modules':s.filterAdmin='Todos';s.filterStatus='Todos';s.filterSearch='';nav('list');toast('Selecciona una institución','Utiliza el menú de acciones para administrar sus módulos.');break;case 'go-attention':s.filterAdmin='noactive';s.filterStatus='Todos';s.filterSearch='';nav('list');break;case 'attention-filter':s.filterAdmin=el.dataset.status;s.filterStatus='Todos';s.filterSearch='';nav('list');break;case 'cancel-new':s.modal={type:'cancel-new'};render();break;case 'confirm-cancel-new':nav('list');break;case 'step-back':s.formStep=Math.max(1,s.formStep-1);s.formErrors={};render();break;case 'step-next':nextStep();break;case 'create-school':createSchool();break;case 'edit-info':s.editInfo=true;s.infoDraft={...selectedSchool()};s.detailTab='Información';render();break;case 'save-info':saveInfo();break;case 'cancel-edit':s.editInfo=false;render();break;case 'copy-slug':copySlug();break;case 'toggle-status':modalOpen('status',s.activeId);break;case 'open-invite':modalOpen('invite',el.dataset.id||s.activeId);break;case 'resend':modalOpen('resend',el.dataset.id||s.activeId);break;case 'revoke':modalOpen('revoke',el.dataset.id||s.activeId);break;case 'send-invite':sendInvite();break;case 'confirm-resend':confirmResend();break;case 'confirm-revoke':confirmRevoke();break;case 'confirm-status':confirmStatus();break;case 'confirm-remove-modules':{const m=s.modal;const set=m.scope==='detail'?(s.moduleDraft??new Set(selectedSchool().modules)):s.form.modules;const d=new Set(set);closureRemove(d,m.moduleId);if(m.scope==='detail')s.moduleDraft=d;else s.form.modules=d;s.modal=null;render();toast('Dependencias actualizadas','Los módulos relacionados se desactivaron en la selección.');break}case 'save-modules':if(s.moduleDraft){selectedSchool().modules=new Set(s.moduleDraft);s.moduleDraft=null;logs.unshift({icon:'layers-3',action:'Módulos actualizados (demo)',school:selectedSchool().name,when:'Ahora · demostración'});render();toast('Módulos guardados','La configuración se actualizó en esta demostración.')}break;case 'reset-modules':s.moduleDraft=null;render();toast('Cambios descartados');break;case 'close-modal':s.modal=null;render();break;default:break}}
    document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]')){s.modal=null;render();return}const navEl=e.target.closest('[data-nav]');if(navEl){e.preventDefault();nav(navEl.dataset.nav);return}const stepEl=e.target.closest('[data-wizard-step]');if(stepEl){const n=+stepEl.dataset.wizardStep;if(n<=s.formStep){s.formStep=n;s.formErrors={};render()}return}const tabEl=e.target.closest('[data-detail-tab]');if(tabEl){s.detailTab=tabEl.dataset.detailTab;s.editInfo=false;render();return}const schoolEl=e.target.closest('[data-open]');if(schoolEl){openSchool(schoolEl.dataset.open);return}const moduleEl=e.target.closest('[data-toggle-module]');if(moduleEl){handleModuleToggle(moduleEl.dataset.toggleModule,moduleEl.dataset.moduleScope);return}const r=e.target.closest('[data-row-action]');if(r){handleRowAction(+r.dataset.id,r.dataset.rowAction);return}const menu=e.target.closest('[data-menu]');if(menu){const id=+menu.dataset.menu;s.rowMenu=s.rowMenu===id?null:id;render();return}const pageEl=e.target.closest('[data-page]');if(pageEl){const n=pageEl.dataset.page,pageCount=Math.ceil(filteredSchools().length/s.pageSize);s.currentPage=n==='prev'?Math.max(1,s.currentPage-1):n==='next'?Math.min(pageCount,s.currentPage+1):+n;render();return}const actionEl=e.target.closest('[data-action]');if(actionEl){runAction(actionEl.dataset.action,actionEl);return}if(s.rowMenu&&!e.target.closest('.row-menu-wrap')){s.rowMenu=null;render();return}if(s.topPopover&&!e.target.closest('.pop-anchor')){s.topPopover='';render()}});
    document.addEventListener('input',e=>{const t=e.target;if(t.id==='filter-search'){s.filterSearch=t.value;s.currentPage=1;const pos=t.selectionStart;render();const input=$('#filter-search');input?.focus();input?.setSelectionRange(pos,pos);return}if(t.dataset.form){s.form[t.dataset.form]=t.value;if(t.dataset.form==='slug')s.form.slugTouched=true;if(t.dataset.form==='name'&&!s.form.slugTouched){s.form.slug=t.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45);const slug=$('#form-slug');if(slug)slug.value=s.form.slug}return}if(t.id==='global-search'){const q=t.value.trim().toLowerCase(),res=$('#global-search-results');if(!res)return;if(!q){res.style.display='none';return}const found=schools.filter(x=>`${x.name} ${x.slug}`.toLowerCase().includes(q)).slice(0,5);res.style.display='block';res.innerHTML=found.length?found.map(x=>`<button class="search-result" data-open="${x.id}">${ic('building-2',16)}<span><strong>${esc(x.name)}</strong><small>${esc(x.slug)}</small></span></button>`).join(''):`<div class="popover-item">Sin instituciones coincidentes</div>`;return}if(t.id==='invite-email')s.modalInput=t.value});
    document.addEventListener('change',e=>{if(e.target.id==='filter-status'){s.filterStatus=e.target.value;s.currentPage=1;render()}if(e.target.id==='filter-admin'){s.filterAdmin=e.target.value;s.currentPage=1;render()}if(e.target.id==='chart-period'){s.period=e.target.value;render()}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.modal){s.modal=null;render();return}if(s.sidebarOpen){s.sidebarOpen=false;render();return}if(s.rowMenu||s.topPopover){s.rowMenu=null;s.topPopover='';render()}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#global-search')?.focus()}});
    // Simple route restoration from URL hash.
    const hash=location.hash.replace(/^#\/?/,'');if(hash==='instituciones')s.page='list';else if(hash==='instituciones/nueva')s.page='new';else if(/^instituciones\/\d+$/.test(hash)){s.activeId=+hash.split('/')[1];if(schools.find(x=>x.id===s.activeId))s.page='detail'}
    render();
  })();
  </script>
</body>

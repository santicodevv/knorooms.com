<div class="attention"><button class="attention-row" data-go="students" data-stufilter="pending"><span class="att-icon">${I('user')}</span><span style="flex:1"><span class="att-name">Sin matrícula activa</span><div class="att-desc">Expedientes que todavía no están matriculados.</div></span><span class="att-count">${db.students.filter(s=>s.active&&!enrollment(s.id)).length}</span>${I('chevron')}</button><button class="attention-row" data-go="grades"><span class="att-icon">${I('clipboard')}</span><span style="flex:1"><span class="att-name">Calificaciones por revisar</span><div class="att-desc">Borradores pendientes de aprobación.</div></span><span class="att-count">${pendingReview}</span>${I('chevron')}</button><button class="attention-row" data-go="attendance"><span class="att-icon">${I('clock')}</span><span style="flex:1"><span class="att-name">Secciones con asistencia guardada hoy</span><div class="att-desc">Pases de lista registrados para la fecha seleccionada.</div></span><span class="att-count">${attendanceToday.length}</span>${I('chevron')}</button></div></section></div><div style="height:17px"></div><section class="card">${headerCard('Actividad administrativa de la demostración','Se actualiza al realizar acciones en este prototipo.')}${db.activities.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Actividad</th><th>Responsable</th><th>Fecha</th></tr></thead><tbody>${db.activities.slice(0,6).map(x=>`<tr><td class="strong">${E(x.what)}</td><td>${E(x.by)}</td><td>${dateFmt(x.date)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin actividad','No hay actividad registrada todavía.')}</section>`}
function moduleDisabled(page){const key=moduleFor[page];return key&&!db.modules[key]&&!ui.historyMode?head('Módulo no habilitado','Este colegio no tiene acceso de operación a esta capacidad.')+`<div class="card"><div class="empty"><div class="empty-icon">${I('lock')}</div><strong>Módulo no disponible</strong><p>La configuración de módulos corresponde a la administración global de KNOROOMS. Si hay datos históricos, pueden habilitarse para consulta según las reglas de acceso de la institución.</p></div></div>`:''}
function yearsOptions(){return db.years.map(x=>({value:x.id,label:x.code+' · '+x.status}))}
function sectionOptions(){return db.sections.filter(s=>s.year===ui.year).map(s=>({value:s.id,label:secName(s.id)}))}
function subjectOptions(){return db.subjects.map(s=>({value:s.id,label:s.name}))}
function academic(){const subtabs=[['years','Años escolares'],['grades','Grados y secciones'],['subjects','Materias'],['assignments','Carga docente']];let t=ui.subpage||'years';return head('Organización académica','Configura la estructura del colegio antes de matricular y asignar docentes.',btn('Nueva configuración','plus',`data-go="academic" data-sub="${t==='years'?'new-year':t==='grades'?'new-grade':t==='subjects'?'new-subject':'new-assignment'}"`,'primary'))+`<div class="notice">${I('info')}<div><strong>Orden recomendado:</strong> año escolar → grado y sección → catálogo de materias → asignación docente. Las secciones pertenecen a un año; los grados y las materias son catálogos.</div></div><div class="card">${tabs(subtabs,t)}${t==='years'?academicYears():t==='grades'?academicGrades():t==='subjects'?academicSubjects():academicAssignments()}</div>`}
function academicYears(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Año escolar</th><th>Período</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.years.map(y=>`<tr><td><div class="strong">${E(y.name)}</div><div class="dim">Código: ${E(y.code)}</div></td><td>${dateFmt(y.start)} – ${dateFmt(y.end)}</td><td>${badge(y.status)}</td><td>${btn(y.status==='Abierto'?'Cerrar año':'Reabrir año',y.status==='Abierto'?'lock':'refresh',`data-act="year-toggle" data-id="${y.id}"`,'small')}</td></tr>`).join('')}</tbody></table></div>`}
function academicGrades(){return `<div class="toolbar"><span class="eyebrow">Catálogo de grados</span>${btn('Nuevo grado','plus','data-go="academic" data-sub="new-grade"','small primary')}${btn('Nueva sección','plus','data-go="academic" data-sub="new-section"','small')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Grado</th><th>Código</th><th>Nivel</th><th>Secciones del año</th></tr></thead><tbody>${db.grades.map(g=>`<tr><td class="strong">${E(g.name)}</td><td>${E(g.code)}</td><td>${E(g.level)}</td><td>${db.sections.filter(s=>s.grade===g.id&&s.year===ui.year).map(s=>`<span class="pill">${E(s.code)} · ${E(s.shift)} · ${s.capacity} cupos</span>`).join('')||'<span class="dim">Sin secciones</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function academicSubjects(){return `<div class="toolbar"><span class="eyebrow">Catálogo institucional de materias</span>${btn('Nueva materia','plus','data-go="academic" data-sub="new-subject"','small primary')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Materia</th><th>Código</th></tr></thead><tbody>${db.subjects.map(s=>`<tr><td class="strong">${E(s.name)}</td><td>${E(s.code)}</td></tr>`).join('')}</tbody></table></div>`}
function academicAssignments(){return `<div class="toolbar"><span class="eyebrow">Asignaciones de materias a secciones y docentes</span>${btn('Asignar docente','plus','data-go="academic" data-sub="new-assignment"','small primary')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Sección</th><th>Materia</th><th>Docente</th><th>Horas semanales</th></tr></thead><tbody>${db.assignments.map(a=>`<tr><td>${E(secName(a.section))}</td><td class="strong">${E(lookup('subjects',a.subject)?.name)}</td><td>${E(lookup('members',a.member)?.name)}</td><td>${a.hours} h</td></tr>`).join('')}</tbody></table></div>`}
function createPage(){const kinds={'new-year':['Crear año escolar','Define un ciclo con fechas de apertura y cierre.'],'new-grade':['Registrar grado','Agrégalo al catálogo institucional.'],'new-section':['Crear sección','Vincula un grado a un año escolar y define capacidad.'],'new-subject':['Registrar materia','Agrégala al catálogo para futuras asignaciones.'],'new-assignment':['Asignar docente','Vincula docente, materia y sección, sin crear una materia duplicada.'],'new-student':['Nuevo expediente','Registra al estudiante. Matricularlo es un paso independiente.'],'new-guardian':['Nuevo responsable','Registrar un responsable no le crea una cuenta de acceso.'],'new-policy':['Nueva política de evaluación','Configura la política versionada de un año escolar.']};const [title,desc]=kinds[ui.subpage]||['Nuevo registro','Completa los datos.'];let inputs='',type=ui.subpage;
if(type==='new-year')inputs=field('Código del año escolar *','code','2027-2028','required')+field('Nombre *','name','Año escolar 2027-2028','required')+field('Fecha de inicio *','start','','type="date" required')+field('Fecha de cierre *','end','','type="date" required');
if(type==='new-grade')inputs=selectField('Nivel educativo *','level',['Inicial','Primario','Secundario'].map(x=>({value:x,label:x})))+field('Número oficial *','number','','required')+field('Código *','code','','required placeholder="Ej. PRI-04"')+field('Nombre *','name','','required placeholder="Ej. 4.º de Primaria"');
if(type==='new-section')inputs=selectField('Año escolar *','year',yearsOptions(),ui.year)+selectField('Grado *','grade',db.grades.map(x=>({value:x.id,label:x.name})))+field('Código de sección *','code','','required placeholder="Ej. C"')+selectField('Tanda *','shift',['Matutina','Vespertina','Jornada extendida'].map(x=>({value:x,label:x})))+field('Capacidad máxima *','capacity','30','type="number" min="1" max="200" required');
if(type==='new-subject')inputs=field('Código *','code','','required placeholder="Ej. NAT-01"')+field('Nombre de la materia *','name','','required placeholder="Ej. Ciencias de la Naturaleza"');
if(type==='new-assignment')inputs=selectField('Sección *','section',sectionOptions(),ui.section)+selectField('Materia *','subject',subjectOptions(),ui.subject)+selectField('Docente institucional *','member',db.members.filter(x=>x.status==='Activo').map(x=>({value:x.id,label:x.name})))+field('Horas semanales *','hours','4','type="number" min="1" max="50" required');
if(type==='new-student')inputs=field('Código de expediente *','code','','required placeholder="EST-0014"')+field('Nombres *','first','','required')+field('Apellidos *','last','','required')+field('Fecha de nacimiento *','birth','','type="date" required')+field('Identificador SIGERD (opcional)','sigerd','','placeholder="Solo identificador, sin sincronización"');
if(type==='new-guardian')inputs=field('Nombre completo *','name','','required')+field('Correo electrónico','email','','type="email" placeholder="persona@correo.com"')+field('Teléfono','phone','','placeholder="809-000-0000"');
if(type==='new-policy')inputs=selectField('Año escolar *','year',yearsOptions(),ui.year)+field('Código *','code','','required placeholder="POL-27"')+field('Versión *','version','1','required')+field('Nombre *','name','','required')+field('Nota mínima aprobatoria *','min','70','type="number" min="0" max="100" required')+`<div class="control wide"><label>Observaciones</label><textarea name="notes"></textarea></div><label style="grid-column:1/-1;font-size:11px"><input name="validated" type="checkbox" style="width:auto;margin-right:7px">Validada con el colegio piloto (marcar únicamente si corresponde)</label>`;
let back=type==='new-student'?'students':type==='new-guardian'?'guardians':type==='new-policy'?'settings':'academic';return `<div class="form-page">${head(title,desc,btn('Volver','back',`data-go="${back}"`))}<div class="card"><form id="form-create" data-kind="${type}" class="card-body"><div class="formsection"><h3 class="section-title">Datos del registro</h3><p class="section-desc">Los campos con * son obligatorios. Los datos solo se guardan en esta demostración local.</p><div class="formgrid">${inputs}</div></div><div id="form-error" role="alert"></div><div class="footer-actions">${btn('Cancelar',null,`data-go="${back}"`)}<button class="btn primary" type="submit">${I('check')} Guardar registro</button></div></form></div></div>`}
function students(){const rows=db.students.filter(s=>{const q=ui.q.toLowerCase();const matches=!q||studentName(s).toLowerCase().includes(q)||s.code.toLowerCase().includes(q)||s.sigerd.toLowerCase().includes(q);const f=ui.studentFilter==='pending'?!enrollment(s.id):ui.studentFilter==='active'?s.active:ui.studentFilter==='inactive'?!s.active:true;return matches&&f});const visible=rows.slice((ui.pag-1)*8,ui.pag*8);return head('Estudiantes','Expedientes permanentes, consultas y vínculos con responsables.',btn('Nuevo estudiante','plus','data-go="students" data-sub="new-student"','primary'))+`<div class="card responsive-list"><div class="toolbar"><div class="search">${I('search')}<input id="search-students" placeholder="Buscar nombre, código o SIGERD" value="${E(ui.q)}" data-search></div><select class="field" data-stufilter><option value="all">Todos los expedientes</option><option value="active" ${ui.studentFilter==='active'?'selected':''}>Activos</option><option value="pending" ${ui.studentFilter==='pending'?'selected':''}>Sin matrícula</option><option value="inactive" ${ui.studentFilter==='inactive'?'selected':''}>Inactivos</option></select></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Estudiante</th><th>Código de expediente</th><th>Matrícula actual</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${visible.map(s=>{let en=enrollment(s.id);return `<tr><td><div class="cell-name"><div class="avatar">${E(s.first[0]+s.last[0])}</div><div><div class="strong">${E(studentName(s))}</div><div class="dim">${E(s.sigerd?'SIGERD: '+s.sigerd:'Sin ID externo SIGERD')}</div></div></div></td><td data-label="Expediente">${E(s.code)}</td><td data-label="Matrícula">${en?E(secName(en.section)):'<span class="badge amber">Pendiente</span>'}</td><td data-label="Estado">${badge(s.active?'Activo':'Inactivo')}</td><td>${btn('Ver ficha','eye',`data-go="students" data-sub="detail" data-id="${s.id}"`,'small')}</td></tr>`}).join('')}</tbody></table></div>${pagination(rows.length,8)}`:empty('Sin estudiantes coincidentes','Prueba otra búsqueda o cambia los filtros.')}</div>`}
function pagination(total,size){const pages=Math.max(1,Math.ceil(total/size));return `<div class="pagination"><span>Mostrando ${total?Math.min(total,(ui.pag-1)*size+1):0}–${Math.min(total,ui.pag*size)} de ${total}</span><div class="pager"><button data-page="${Math.max(1,ui.pag-1)}" ${ui.pag===1?'disabled':''} aria-label="Anterior">‹</button>${Array.from({length:pages},(_,i)=>`<button data-page="${i+1}" ${ui.pag===i+1?'style="color:#155dfc;border-color:#a8c3fa;background:#edf3ff;font-weight:800"':''}>${i+1}</button>`).join('')}<button data-page="${Math.min(pages,ui.pag+1)}" ${ui.pag===pages?'disabled':''} aria-label="Siguiente">›</button></div></div>`}
function studentDetail(){const s=lookup('students',ui.record);if(!s)return students();const links=db.links.filter(l=>l.student===s.id);const ens=db.enrollments.filter(e=>e.student===s.id);const tab=ui.tab||'summary';return head(studentName(s),`Expediente ${E(s.code)} · ${s.active?'Activo':'Inactivo'}`,btn('Volver al directorio','back','data-go="students"'))+`<div class="card" style="margin-bottom:17px"><div class="card-body" style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:54px;height:54px;font-size:17px">${E(s.first[0]+s.last[0])}</div><div style="flex:1"><div class="card-title" style="font-size:16px">${E(studentName(s))}</div><div class="dim">${E(s.code)} · Nacimiento: ${dateFmt(s.birth)}</div></div>${badge(s.active?'Activo':'Inactivo')}${btn(s.active?'Desactivar expediente':'Activar expediente','shield',`data-act="student-toggle" data-id="${s.id}"`,'small')}</div>${tabs([['summary','Resumen'],['guardians','Responsables'],['enrollments','Matrículas']],tab)}<div class="card-body">${tab==='summary'?`<dl class="kv"><div><dt>Nombre completo</dt><dd>${E(studentName(s))}</dd></div><div><dt>Código</dt><dd>${E(s.code)}</dd></div><div><dt>Fecha de nacimiento</dt><dd>${dateFmt(s.birth)}</dd></div><div><dt>Identificador externo SIGERD</dt><dd>${E(s.sigerd||'No registrado')}</dd></div><div><dt>Situación académica actual</dt><dd>${E(enrollment(s.id)?secName(enrollment(s.id).section):'Sin matrícula vigente')}</dd></div><div><dt>Responsables vinculados</dt><dd>${links.length}</dd></div></dl><div class="notice" style="margin-top:18px;margin-bottom:0">${I('info')}<div>El expediente se conserva a través de los años. Para vincularlo con una sección y un año escolar, utiliza <strong>Matricular estudiante</strong>.</div></div>`:tab==='guardians'?`${links.length?links.map(l=>`<div class="list-item"><div><div class="list-title">${E(lookup('guardians',l.guardian)?.name)}</div><div class="list-caption">${E(l.relation)} · ${[l.academic?'Acceso académico':'',l.finance?'Responsabilidad financiera':'',l.pickup?'Recogida autorizada':''].filter(Boolean).join(' · ')||'Sin marcas adicionales'}</div></div></div>`).join(''):empty('Sin responsables vinculados','Puedes vincular un responsable ya registrado.')}${btn('Vincular responsable','plus',`data-modal="link-guardian" data-id="${s.id}"`,'primary small')}`:`${ens.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Año escolar</th><th>Sección</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${ens.map(e=>`<tr><td>${E(lookup('years',e.year)?.code)}</td><td>${E(secName(e.section))}</td><td>${badge(e.status)}</td><td>${e.status==='Activo'?`${btn('Trasladar','arrow',`data-modal="transfer" data-id="${e.id}"`,'small')}${btn('Retirar','x',`data-modal="withdraw" data-id="${e.id}"`,'small danger')}`:'Consulta histórica'}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin matrículas registradas','El expediente está creado, pero todavía no tiene matrícula.')}${!enrollment(s.id)?btn('Matricular estudiante','plus',`data-modal="enroll" data-id="${s.id}"`,'primary small'):''}`}</div></div>`}
function enrollmentPage(){const sections=db.sections.filter(s=>s.year===ui.year),tab=ui.tab||'sections';return head('Matrículas','Consulta cupos y administra matrículas por sección y año escolar.',btn('Buscar estudiante para matricular','arrow','data-go="students"','primary'))+`<div class="card" style="margin-bottom:17px"><div class="toolbar">${selectField('Año escolar','year-view',yearsOptions(),ui.year,'data-uichange="year"')}</div>${tabs([['sections','Cupos por sección'],['records','Nómina de matrículas']],tab)}${tab==='sections'?`<div class="table-wrap"><table class="table"><thead><tr><th>Sección</th><th>Tanda</th><th>Capacidad</th><th>Matrículas vigentes</th><th>Cupos disponibles</th><th>Ocupación</th></tr></thead><tbody>${sections.map(s=>{let n=enrolled(s.id).length;return `<tr><td class="strong">${E(secName(s.id))}</td><td>${E(s.shift)}</td><td>${s.capacity}</td><td>${n}</td><td>${s.capacity-n}</td><td style="min-width:135px"><div class="progress"><span style="width:${Math.min(100,n/s.capacity*100)}%"></span></div><span class="dim">${Math.round(n/s.capacity*100)}%</span></td></tr>`}).join('')}</tbody></table></div>`:`<div class="toolbar">${selectField('Sección','section-view',sectionOptions(),ui.section,'data-uichange="section"')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Estudiante</th><th>Código</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.enrollments.filter(e=>e.section===ui.section&&e.year===ui.year).map(e=>{let s=lookup('students',e.student);return `<tr><td class="strong">${E(studentName(s))}</td><td>${E(s?.code)}</td><td>${badge(e.status)}</td><td>${btn('Ver expediente','eye',`data-go="students" data-sub="detail" data-id="${e.student}"`,'small')}</td></tr>`}).join('')}</tbody></table></div>`}</div>`}

function attendancePage(){const sec=lookup('sections',ui.section);const students=enrolled(ui.section);const saved=db.attendance[attendanceKey(ui.section,ui.date)]||{};const draft=ui.attendanceDraft;const counts={P:0,A:0,T:0,E:0};students.forEach(s=>{const v=draft[s.id]??saved[s.id];if(counts[v]!==undefined)counts[v]++});const totalSet=Object.values(counts).reduce((a,b)=>a+b,0);return head('Pase de lista','Registra presencia, ausencia, tardanza o excusa. Sin marcar no significa ausente.',btn('Ver calificaciones','arrow','data-go="grades"'))+`<div class="card" style="margin-bottom:16px"><div class="toolbar" style="gap:17px"><div class="control"><label>Año escolar</label><select class="field" data-uichange="year">${option(yearsOptions(),ui.year,'')}</select></div><div class="control"><label>Sección</label><select class="field" data-uichange="section">${option(sectionOptions(),ui.section,'')}</select></div><div class="control"><label>Fecha</label><input type="date" class="field" data-uichange="date" value="${E(ui.date)}"></div></div></div><div class="stats">${stat('Estudiantes de la sección',students.length,'users','Con matrícula activa')}${stat('Registros definidos',totalSet,'clipboard',`${students.length-totalSet} sin marcar`)}${stat('Presentes',counts.P,'checkCircle','Solo confirmados')}${stat('Tardanzas / ausencias',counts.T+counts.A,'clock',`${counts.T} tardanza(s) · ${counts.A} ausencia(s)`)}</div><section class="card">${headerCard('Pase de lista · '+E(secName(ui.section)),'Los cambios no se guardan hasta pulsar Guardar pase de lista.',btn('Todos presentes','check', 'data-act="all-present"','small'))}${students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Estudiante</th><th>Estado registrado</th><th>Marcar</th></tr></thead><tbody>${students.map(s=>{const a=draft[s.id]??saved[s.id]??'';return `<tr><td><div class="strong">${E(studentName(s))}</div><div class="dim">${E(s.code)}</div></td><td>${a?badge(({P:'Presente',A:'Ausente',T:'Tardanza',E:' function gradesPage(){const students=enrolled(ui.section),key=gradeKey(ui.section,ui.subject,ui.period),values=db.gradesData[key]||{},draft=ui.gradeDraft[key]||{},owner=db.gradeDraftOwner[key],approved=db.gradesApproved[key],published=db.gradesPublished[key],policy=db.policies.find(p=>p.year===ui.year),scores=students.map(s=>draft[s.id]??values[s.id]).filter(x=>x!==undefined&&x!=='').map(Number),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*10)/10:'—';return head('Calificaciones','Registra notas por materia y período; la aprobación corresponde a otro usuario autorizado.',btn('Políticas de evaluación','settings','data-go="settings" data-sub="policies"'))+`<div class="card" style="margin-bottom:16px"><div class="toolbar" style="gap:14px"><div class="control"><label>Año escolar</label><select data-uichange="year" class="field">${option(yearsOptions(),ui.year,'')}</select></div><div class="control"><label>Sección</label><select data-uichange="section" class="field">${option(sectionOptions(),ui.section,'')}</select></div><div class="control"><label>Materia</label><select data-uichange="subject" class="field">${option(subjectOptions(),ui.subject,'')}</select></div><div class="control"><label>Período</label><select data-uichange="period" class="field">${option(['P1','P2','P3','P4','FINAL'].map(x=>({value:x,label:x})),ui.period,'')}</select></div></div></div><div class="stats">${stat('Estudiantes',students.length,'users','Matrículas activas de la sección')}${stat('Notas capturadas',scores.length,'clipboard',`De ${students.length} registros`)}${stat('Promedio del período',avg,'chart','Según notas capturadas')}${stat('Nota mínima',policy?policy.min:'—','checkCircle',policy?'Definida por política':'No hay política configurada')}</div>${!policy?`<div class="warning-banner">${I('alert')}No hay política de evaluación para el año escolar. Configúrala antes de aprobar o publicar notas.</div>`:''}<section class="card">${headerCard('Libro de notas · '+E(looku function formError(msg){const e=document.getElementById('form-error');if(e)e.innerHTML=`<div class="notice error" role="alert">${I('alert')}${E(msg)}</div>`;else toast(msg,'error')}
function createRecord(form){let t=form.dataset.kind,d=getFormData(form),dest='academic',rec='';const bad=msg=>{formError(msg);return false};const requiredByKind={'new-year':['code','name','start','end'],'new-grade':['level','number','code','name'],'new-section':['year','grade','code','shift','capacity'],'new-subject':['code','name'],'new-assignment':['section','subject','member','hours'],'new-student':['code','first','last','birth'],'new-guardian':['name'],'new-policy':['year','code','version','name','min']};if((requiredByKind[t]||[]).some(k=>!String(d[k]||'').trim()))return bad('Completa los campos obligatorios antes de guardar.');if(t==='new-year'){if(d.start>=d.end)return bad('La fecha de cierre debe ser posterior al inicio.');if(db.years.some(y=>y.code.toLowerCase()===d.code.trim().toLowerCase()))return bad('Ya existe ese código de año escolar.');db.years.push({id:id('y'),code:d.code.trim(),name:d.name.trim(),start:d.start,end:d.end,status:'Abierto'});ui.year=db.years.at(-1).id;ui.subpage='years'}if(t==='new-grade'){if(db.grades.some(g=>g.code.toLowerCase()===d.code.trim().toLowerCase()))return bad('Este código de grado ya existe.');db.grades.push({id:id('g'),level:d.level,number:d.number,code:d.code.trim(),name:d.name.trim()});ui.subpage='grades'}if(t==='new-section'){if(db.sections.some(s=>s.year===d.year&&s.grade===d.grade&&s.code.toLowerCase()===d.code.trim().toLowerCase()))return bad('Ya existe una sección con ese código en el mismo grado y año.');db.sections.push({id:id('sec'),year:d.year,grade:d.grade,code:d.code.trim(),shift:d.shift,capacity:Number(d.capacity)});ui.subpage='grades'}if(t==='new-subject'){if(db.subjects.some(s=>s.code.toLowerCase()===d.code.trim().toLowerCase()))return bad('Este código de materia ya existe.');db.subjects.push({id:id('sub'),code:d.code.trim(),name:d.name.trim()});ui.subpage='subjects'}if(t==='new-assignment'){if(db.assignments.some(a=>a.section===d.section&&a.subject===d.subject))return bad('Esa materia ya tiene asignación en esta sección.');db.assignments.push({id:id('a'),section:d.section,subject:d.subject,member:d.member,hours:Number(d.hours)});ui.subpage='assignments'}if(t==='new-student'){if(db.students.some(s=>s.code.toLowerCase()===d.code.trim().toLowerCase()))return bad('Ya existe este código de expediente.');let st={id:id('st'),code:d.code.trim(),first:d.first.trim(),last:d.last.trim(),birth:d.birth,sigerd:d.sigerd?.trim()||'',active:true};db.students.push(st);dest='students';ui.subpage='detail';rec=st.id}if(t==='new-guardian'){db.guardians.push({id:id('r'),name:d.name.trim(),email:d.email?.trim()||'',phone:d.phone?.trim()||''});dest='guardians';ui.subpage=''}if(t==='new-policy'){let x={id:id('pol'),year:d.year,code:d.code.trim(),version:d.version,name:d.name.trim(),min:Number(d.min),notes:d.notes||'',validated:!!form.querySelector('[name="validated"]').checked};if(db.policies.some(p=>p.year===x.year&&p.code===x.code&&p.version===x.version))return bad('Esta combinación de código y versión ya existe.');db.policies.push(x);dest='settings';ui.subpage='policies'}addLog('Registro: '+t.replace('new-',''));save();ui.page=dest;ui.record=rec;ui.modal='';render();toast('Registro guardado en la demostración.');return true}
function uiChange(key,value){ui[key]=value;if(key==='year'){const first=db.sections.find(s=>s.year===value);ui.section=first?.id||''}if(['year','section','date'].includes(key))ui.attendanceDraft={};if(['year','section','subject','period'].includes(key))ui.gradeDraft={};render()}
function overlayForm(title,desc,body,submit,kind,hidden=''){return `<div class="modal-backdrop" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><div><h3>${E(title)}</h3><p>${E(desc)}</p></div><button class="circlebtn" data-closemodal aria-label="Cerrar">${I('x')}</button></div><form id="modal-form" data-kind="${kind}">${hidden}<div class="modal-body">${body}<div id="modal-error" style="margin-top:12px"></div></div><div class="modal-foot"><button class="btn" type="button" data-closemodal>Cancelar</button><button class="btn ${kind==='withdraw'||kind==='revoke-member'?'danger':'primary'}" type="submit">${I('check')} ${submit}</button></div></form></div></div>`}
function modalBody(){const k=ui.modal,reference=ui.modalId;if(k==='reset')return overlayForm('Restablecer demostración','Se perderán los cambios realizados en este navegador.','<div class="notice warn">'+I('alert')+'Volverán los registros de ejemplo del prototipo.</div>','Restablecer','reset');if(k==='revoke-member'){const m=lookup('members',reference);return overlayForm('Revocar acceso institucional',`Miembro: ${m?.name||''}`,'<div class="notice warn">'+I('alert')+'Esta acción revoca la membresía del usuario en este colegio. No elimina su cuenta general.</div>','Confirmar revocación',k)}if(k==='guardian-detail'){const r=lookup('guardians',reference);return overlayForm('Responsable: '+r?.name,'Estudiantes vinculados.',db.links.filter(x=>x.guardian===reference).map(l=>`<div class="summary-line"><span>${E(studentName(lookup('students',l.student)))}</span><span>${E(l.relation)}</span></div>`).join('')||'<div class="hintbox">Aún no hay vínculos.</div>','Cerrar','close-detail')}
if(k==='link-guardian')return overlayForm('Vincular responsable','Expediente de '+studentName(lookup('students',reference)),selectField('Responsable ya registrado *','guardian',db.guardians.map(r=>({value:r.id,label:r.name})))+selectField('Parentesco *','relation',['Madre','Padre','Abuelo/a','Tutor/a','Otro'].map(x=>({value:x,label:x})))+`<div style="margin-top:15px;display:grid;gap:10px">${[['academic','Acceso académico'],['finance','Responsabilidad financiera'],['pickup','Autorización de recogida']].map(x=>`<label><input type="checkbox" name="${x[0]}" style="margin-right:8px">${x[1]}</label>`).join('')}</div><p class="help" style="margin-top:11px">Estas marcas son atributos del vínculo, no sistemas completos de cobro o recogida.</p>`,'Vincular responsable',k);
if(k==='enroll')return overlayForm('Matricular estudiante',studentName(lookup('students',reference)),selectField('Sección *','section',sectionOptions(),ui.section)+`<p class="help" style="margin-top:12px">Se registrará una matrícula para ${E(lookup('years',ui.year)?.code)}. La capacidad de la sección se validará.</p>`,'Confirmar matrícula',k);
if(k==='transfer'){let e=lookup('enrollments',reference);return overlayForm('Trasladar matrícula',studentName(lookup('students',e?.student)),`<div class="notice warn">${I('info')}<div>La matrícula actual se conservará con estado Trasladado y se creará la nueva matrícula activa.</div></div>`+selectField('Nueva sección *','section',sectionOptions().filter(s=>s.value!==e.section)),'Confirmar traslado',k)}
if(k==='withdraw')return overlayForm('Retirar matrícula','Confirma la operación antes de continuar.',`<div class="warning-banner">${I('alert')}La matrícula se marcará como Retirada. El expediente del estudiante seguirá existiendo.</div>`,'Retirar matrícula',k);
if(k==='year-toggle'){let y=lookup('years',reference);return overlayForm(y.status==='Abierto'?'Cerrar año escolar':'Reabrir año escolar',y.name,`<div class="warning-banner">${I('alert')}En el producto real esta operación requiere comprobar las validaciones del año escolar y permisos efectivos. Aquí se simula el cambio de estado.</div>`,'Confirmar cambio',k)}
if(k==='student-toggle'){let s=lookup('students',reference);return overlayForm(s.active?'Desactivar expediente':'Activar expediente',studentName(s),`<p>La operación modifica el estado de este expediente de demostración; no borra su historial.</p>`,'Confirmar',k)}
if(k==='bulletin-check'){let s=lookup('students',reference);let problems=bulletinReady(s.id,ui.section,ui.period);return overlayForm('Requisitos para publicar',studentName(s),problems.length?`<div class="notice warn">${I('alert')}Faltan requisitos para esta boleta.</div>${problems.map(x=>`<div class="summary-line">${I('alert')}<span style="flex:1">${E(x)}</span></div>`).join('')}`:`<div class="notice good">${I('checkCircle')}El estudiante cumple las condiciones de demostración para publicar.</div>`,'Entendido','close-detail')}
if(k==='bulletin-view'){const b=db.bulletins.find(x=>x.id===reference);return overlayForm(`Boleta · Versión ${b?.version}`,'Copia histórica inmutable dentro de la demostración.',`<div class="hintbox"><div class="strong">${E(b?.snapshot?.school||'Colegio')}</div>${E(b?.snapshot?.student||'')} · ${E(b?.period||'')}<div style="margin-top:12px">${(b?.snapshot?.scores||[]).map(x=>`<div class="summary-line"><span>${E(x.subject)}</span><strong>${E(x.grade)}</strong></div>`).join('')}</div></div><p class="help" style="margin-top:12px">Motivo: ${E(b?.reason||'Publicación original')}</p>`,'Cerrar','close-detail')}
if(k==='bulletin-rectify'){const b=db.bulletins.find(x=>x.id===reference);return overlayForm('Rectificar boleta',`Se creará una nueva versión, sin modificar la versión ${b?.version}.`,`<div class="control"><label for="reason">Motivo auditable (mínimo 10 caracteres) *</label><textarea id="reason" name="reason" minlength="10" required placeholder="Explica el motivo de la rectificación"></textarea></div><div class="notice warn" style="margin-top:12px">${I('info')}La nueva versión conservará una instantánea de los datos publicados en el prototipo.</div>`,'Crear nueva versión',k)}
if(k==='publish-bulletin'){const s=lookup('students',reference);return overlayForm('Publicar boleta',studentName(s),`<div class="notice warn">${I('alert')}Una boleta publicada es histórica e inmutable. La corrección se hará mediante otra versión, no editando esta publicación.</div>`,'Publicar boleta',k)}
return overlayForm('Confirmar acción','',`<p>Esta acción requiere confirmación.</p>`,'Aceptar',k)}
function modalError(msg){const x=document.getElementById('modal-error');if(x)x.innerHTML=`<div class="notice error">${I('alert')}${E(msg)}</div>`;else toast(msg,'error')}
function submitModal(form){const k=form.dataset.kind,d=getFormData(form),ref=ui.modalId,err=msg=>{modalError(msg);return};if(k==='link-guardian'&&(!d.guardian||!d.relation))return err('Selecciona responsable y parentesco.');if(['enroll','transfer'].includes(k)&&!d.section)return err('Selecciona una sección.');if(k==='reset'){db=seed();save();ui.page='home';ui.subpage='';ui.year='y1';ui.section='sec1';ui.subject='sub1';ui.modal='';render();toast('Datos de demostración restablecidos.');return}if(k==='close-detail'){ui.modal='';render();return}if(k==='guardian-detail'){ui.modal='';render();return}if(k==='link-guardian'){if(db.links.some(x=>x.student===ref&&x.guardian===d.guardian))return err('Este responsable ya está vinculado.');db.links.push({id:id('ln'),student:ref,guardian:d.guardian,relation:d.relation,academic:!!d.academic,finance:!!d.finance,pickup:!!d.pickup})}if(k==='enroll'){if(enrollment(ref))return err('El estudiante ya tiene una matrícula vigente en este año.');const sec=lookup('sections',d.section);if(!sec||sec.year!==ui.year)return err('Selecciona una sección del año vigente.');if(enrolled(d.section).length>=sec.capacity)return err('No hay cupos disponibles en esa sección.');db.enrollments.push({id:id('en'),student:ref,section:d.section,year:ui.year,status:'Activo'});ui.tab='enrollments'}if(k==='transfer'){const old=lookup('enrollments',ref),next=lookup('sections',d.section);if(!next)return err('Selecciona una sección de destino.');if(enrolled(next.id).length>=next.capacity)return err('No hay cupos en la sección de destino.');old.status='Trasladado';db.enrollments.push({id:id('en'),student:old.student,section:next.id,year:old.year,status:'Activo'})}if(k==='withdraw'){lookup('enrollments',ref).status='Retirado'}if(k==='revoke-member'){const m=lookup('members',ref);if(!m||m.status!=='Activo')return err('La membresía ya no está activa.');m.status='Revocado'}if(k==='student-toggle'){const s=lookup('students',ref);s.active=!s.active}if(k==='year-toggle'){const y=lookup('years',ref);y.status=y.status==='Abierto'?'Cerrado':'Abierto'}if(k==='publish-bulletin'){const issues=bulletinReady(ref,ui.section,ui.period);if(issues.length)return err('No se puede publicar: '+issues.join('; '));const snap=snapshot(ref,ui.section,ui.period);const vers=db.bulletins.filter(b=>b.student===ref&&b.year===ui.year&&b.period===ui.period);if(vers.length)return err('Ya existe una versión. Utiliza la acción Rectificar desde el historial.');db.bulletins.push({id:id('bo'),student:ref,year:ui.year,section:ui.section,period:ui.period,date:today,version:1,reason:'',snapshot:snap})}if(k==='bulletin-rectify'){const b=db.bulletins.find(x=>x.id===ref);if(!b)return err('Versión no encontrada.');if((d.reason||'').trim().length<10)return err('El motivo debe contener al menos 10 caracteres.');const list=db.bulletins.filter(x=>x.student===b.student&&x.year===b.year&&x.period===b.period);db.bulletins.push({...b,id:id('bo'),version:Math.max(...list.map(x=>x.version))+1,date:today,reason:d.reason.trim(),snapshot:snapshot(b.student,b.section,b.period,b.year)})}addLog(({enroll:'Matrícula registrada',transfer:'Traslado de matrícula',withdraw:'Matrícula retirada','link-guardian':'Responsable vinculado','revoke-member':'Acceso institucional revocado','publish-bulletin':'Boleta publicada','bulletin-rectify':'Nueva versión de boleta', 'year-toggle':'Estado de año escolar actualizado','student-toggle':'Estado de expediente actualizado'})[k]||'Operación de demostración');save();ui.modal='';render();toast('Acción realizada en la demostración.');}
function snapshot(student,section,period,year=ui.year){const s=lookup('students',student),en=enrollment(student,year);return {school:'Colegio Dominicano San Miguel',student:studentName(s),grade:secName(section),year:lookup('years',year)?.code,period,policy:db.policies.find(p=>p.year===year)?.name,attendance:Object.values(db.attendance).flatMap(x=>x[student]?[x[student]]:[]),scores:db.assignments.filter(a=>a.section===section).map(a=>({subject:lookup('subjects',a.subject)?.name,grade:db.gradesData[gradeKey(section,a.subject,period)]?.[student]}))}}
function doAct(act,reference){if(['student-toggle','year-toggle','publish-bulletin'].includes(act)){ui.modal=act;ui.modalId=reference;render();return}if(act==='refresh'){toast('Datos locales actualizados.');return}if(act==='all-present'){enrolled(ui.section).forEach(s=>ui.attendanceDraft[s.id]='P');render();toast('Todos marcados presentes. Falta guardar.');return}if(act==='save-attendance'){const k=attendanceKey(ui.section,ui.date);db.attendance[k]={...(db.attendance[k]||{}),...ui.attendanceDraft};if(!Object.keys(db.attendance[k]).length){toast('No hay marcas nuevas para guardar.','error');return}ui.attendanceDraft={};addLog('Pase de lista guardado');save();render();toast('Pase de lista guardado.');return}if(act==='save-grades'){const k=gradeKey(ui.section,ui.subject,ui.period);if(db.gradesApproved[k]||db.gradesPublished[k]){toast('Las calificaciones aprobadas o publicadas no pueden editarse aquí.','error');return}let draft=ui.gradeDraft[k]||{};if(!Object.keys(draft).length){toast('No hay cambios de calificación.','error');return}db.gradesData[k]={...(db.gradesData[k]||{}),...draft};db.gradeDraftOwner[k]=ui.reviewAs;delete ui.gradeDraft[k];addLog('Borrador de notas guardado');save();render();toast('Borrador guardado.');return}if(act==='approve-grades'){const k=gradeKey(ui.section,ui.subject,ui.period),owner=db.gradeDraftOwner[k],vals=db.gradesData[k]||{};if(!owner)return toast('Primero guarda el borrador de notas.','error');if(ui.reviewAs===owner)return toast('Debe aprobar otro usuario autorizado, distinto del registrador.','error');if(!db.policies.find(p=>p.year===ui.year))return toast('Falta la política de evaluación.','error');if(enrolled(ui.section).some(s=>vals[s.id]===undefined))return toast('Faltan calificaciones para algunos estudiantes.','error');db.gradesApproved[k]=ui.reviewAs;addLog('Calificaciones aprobadas');save();render();toast('Calificaciones aprobadas en la demo.');return}if(act==='publish-grades'){const k=gradeKey(ui.section,ui.subject,ui.period);if(!db.gradesApproved[k])return toast('Las calificaciones necesitan aprobación de otro usuario.','error');db.gradesPublished[k]=true;addLog('Calificaciones publicadas');save();render();toast('Calificaciones publicadas en la demo.');return}}
function wire(){document.addEventListener('click',e=>{const b=e.target.closest('button,[data-backdrop]');if(!b)return;if(b.hasAttribute('data-togglemenu')){ui.mobile=!ui.mobile;render();return}if(b.hasAttribute('data-closemenu')){ui.mobile=false;render();return}if(b.hasAttribute('data-closemodal')||(b.hasAttribute('data-backdrop')&&e.target===b)){ui.modal='';render();return}if(b.dataset.go){const extra=b.dataset.stufilter;if(extra)ui.studentFilter=extra;navigate(b.dataset.go,b.dataset.sub||'',b.dataset.id||'');return}if(b.dataset.tab){if(ui.page==='academic'||ui.page==='settings'){ui.subpage=b.dataset.tab}else{ui.tab=b.dataset.tab}ui.pag=1;render();return}if(b.dataset.page){ui.pag=+b.dataset.page;render();return}if(b.dataset.state){ui.statePreview=b.dataset.state;render();return}if(b.dataset.modal){ui.modal=b.dataset.modal;ui.modalId=b.dataset.id||'';render();return}if(b.dataset.act){doAct(b.dataset.act,b.dataset.id||'');return}if(b.dataset.attstudent){ui.attendanceDraft[b.dataset.attstudent]=b.dataset.status;render();return}if(b.hasAttribute('data-reset')){ui.modal='reset';render();return}if(b.hasAttribute('data-demo-logout')){toast('Cierre de sesión simulado; no hay autenticación conectada.');return}if(b.hasAttribute('data-history')){ui.historyMode=true;render();return}});
document.addEventListener('submit',e=>{if(e.target.id==='form-create'){e.preventDefault();createRecord(e.target)}if(e.target.id==='modal-form'){e.preventDefault();submitModal(e.target)}});
document.addEventListener('change',e=>{if(e.target.dataset.uichange){uiChange(e.target.dataset.uichange,e.target.value);return}if(e.target.dataset.stufilter!==undefined){ui.studentFilter=e.target.value;ui.pag=1;render();return}if(e.target.dataset.grade){const k=gradeKey(ui.section,ui.subject,ui.period),value=e.target.value;if(value!==''&&(Number(value)<0||Number(value)>100)){toast('La nota debe estar entre 0 y 100.','error');e.target.value='';return}ui.gradeDraft[k]=ui.gradeDraft[k]||{};if(value==='')delete ui.gradeDraft[k][e.target.dataset.grade];else ui.gradeDraft[k][e.target.dataset.grade]=Number(value);return}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.dataset.search===undefined)return;clearTimeout(searchTimer);let value=e.target.value;searchTimer=setTimeout(()=>{ui.q=value;ui.pag=1;const selector=ui.page==='students'?'#search-students':'[data-search]';render();const n=document.querySelector(selector);if(n){n.focus();n.setSelectionRange(value.length,value.length)}},210)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal='';render()}if(e.key==='Escape'&&ui.mobile){ui.mobile=false;render()}})}
wire();render();
</script></body></html>
